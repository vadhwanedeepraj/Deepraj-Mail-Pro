services:
  - type: web
    name: deepraj-mail-pro
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ping

    # ── Environment Variables ────────────────────────────────────────────────
    envVars:
      # Render injects PORT automatically — must use 10000 for Render free tier
      - key: PORT
        value: "10000"

      - key: NODE_ENV
        value: production

      # Render log level — keep as "warn" to reduce noise on free tier
      - key: LOG_LEVEL
        value: warn

      # Auto-generated by Render — safe to regenerate (invalidates all sessions)
      - key: JWT_SECRET
        generateValue: true

      # ⚠️  CRITICAL: Set manually in the Render dashboard.
      #     Generate ONCE with: openssl rand -hex 16
      #     NEVER change after first deploy — changing corrupts all SMTP passwords.
      - key: ENCRYPTION_KEY
        sync: false

      # PostgreSQL connection string
      # Free options: Neon.tech (recommended), Supabase, or Render's own DB add-on
      - key: DATABASE_URL
        sync: false

      # Your Render service URL (e.g. https://deepraj-mail-pro.onrender.com)
      - key: BACKEND_URL
        sync: false

      # Your Vercel frontend URL (e.g. https://deepraj-mail-pro.vercel.app)
      - key: CORS_ORIGINS
        sync: false

      # Default admin account email
      - key: ADMIN_EMAIL
        sync: false

      # Default admin account password (min 12 chars in production)
      - key: ADMIN_PASSWORD
        sync: false

      # Shared secret for the Vercel SMTP proxy
      # Generate: openssl rand -hex 32
      - key: PROXY_SECRET
        generateValue: true

      # Must be false on Render — Render free tier blocks outbound SMTP ports
      - key: BYPASS_PROXY_LOCALLY
        value: "false"

      # Vercel SMTP proxy URL
      - key: VERCEL_PROXY_URL
        value: "https://email-proxy-one.vercel.app/api/send"

      # Redis is optional — in-memory fallback used when not set
      # Set this if you add a Redis add-on or use Upstash (free tier)
      - key: REDIS_URL
        sync: false
