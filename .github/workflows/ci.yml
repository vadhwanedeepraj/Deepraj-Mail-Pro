name: Deepraj Mail Pro CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    # ── Backend ──────────────────────────────────────────────────────────────
    - name: Install Backend Dependencies
      run: cd backend && npm ci

    - name: Security Audit (Backend)
      # ISSUE-22 Fix: Catch known vulnerabilities before they reach production
      run: cd backend && npm audit --audit-level=high
      continue-on-error: false

    - name: Syntax Check Backend
      run: cd backend && node --check server.js

    # ── Frontend ─────────────────────────────────────────────────────────────
    - name: Install Frontend Dependencies
      run: cd frontend && npm ci --legacy-peer-deps

    - name: Security Audit (Frontend)
      # ISSUE-22 Fix: Flag high/critical CVEs in frontend dependencies
      run: cd frontend && npm audit --audit-level=high
      continue-on-error: true  # Frontend audits are advisory (react-scripts has known low-severity issues)

    - name: Build Frontend
      run: cd frontend && npm run build
      env:
        CI: false                    # Allow warnings without failing build
        GENERATE_SOURCEMAP: false    # Reduce build size
        NODE_OPTIONS: "--max-old-space-size=1024"
